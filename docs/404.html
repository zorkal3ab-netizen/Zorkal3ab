<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>ZORK CRAFT</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query parameter, and redirects to the index.html page
      var pathSegmentsToKeep = 1;

      var l = window.location;
      // If we are on custom domain, localhost, or root domain, keep 0 segments
      if (l.hostname === 'localhost' || l.hostname.indexOf('.run.app') !== -1 || (l.hostname.endsWith('github.io') === false && l.hostname.split('.').length === 2)) {
        pathSegmentsToKeep = 0;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #07070B; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif;">
    <p>جاري تحويلك إلى منصة ZORK CRAFT...</p>
  </body>
</html>
